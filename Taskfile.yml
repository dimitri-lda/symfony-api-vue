version: "3"

tasks:
  setup:
    desc: "Install dependencies"
    cmds:
      - composer install
      - npm install

  up:
    cmds:
      - docker-compose up
    silent: true
  upd:
    cmds:
      - docker-compose up -d
    silent: true
  stop:
    cmds:
      - docker-compose stop
  down:
    cmds:
      - docker-compose down
  bash:
    cmds:
      - docker exec -it symfony-api-vue-php-1 bash

  cache-clear:
    desc: "Clear Symfony cache"
    cmds:
      - php bin/console cache:clear

  diff:
    desc: "Run Doctrine migrations"
    cmds:
      - docker exec -it symfony-api-vue-php-1 php bin/console doctrine:migrations:diff --no-interaction

  migrate:
    desc: "Run Doctrine migrations"
    cmds:
      - docker exec -it symfony-api-vue-php-1 php bin/console doctrine:migrations:migrate --no-interaction

  test:
    desc: "Run PHPUnit tests"
    cmds:
      - docker exec -it symfony-api-vue-php-1 php bin/phpunit

  logs:
    desc: "View Docker logs"
    cmds:
      - docker-compose logs -f
