services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: symfony
      MYSQL_USER: symfony
      MYSQL_PASSWORD: pwd_secret
      MYSQL_ROOT_PASSWORD: pwd_rootsecret
    ports:
      - "3307:3306"   # Внешний порт 3307 для избежания конфликтов
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
